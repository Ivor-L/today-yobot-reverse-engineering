function openDrawer(crumb,html,key){closeSearch();lastFocus=document.activeElement;activeDetail=key;$('#crumb').textContent=crumb;$('#drawer-content').innerHTML=html;$('#drawer').inert=false;$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');$('#shade').classList.add('open');$('main').inert=true;$('.topbar').inert=true;document.body.style.overflow='hidden';$('#drawer-content').scrollTop=0;$('#drawer .close').focus()}
function closeDrawer(){if(!$('#drawer').classList.contains('open'))return;$('#drawer').classList.remove('open');$('#drawer').inert=true;$('#drawer').setAttribute('aria-hidden','true');$('#shade').classList.remove('open');$('main').inert=false;$('.topbar').inert=false;document.body.style.overflow='';activeDetail=null;if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function sourcesHTML(ids){return ids.map(id=>{const s=by('sources',id);if(!s)return'';return `<div class="source"><div class="source-head"><span>${esc(s.speaker)} · 虚构原话</span><span>${esc(s.date)}</span></div><blockquote>“${esc(s.text)}”</blockquote><p class="source-note">${esc(s.note)}</p></div>`}).join('')}
function paragraphs(text){return `<div class="prose">${text.split('\n').filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join('')}</div>`}

function showSettings(){openDrawer('数据与设置 / 原型配置',`<h2 id="drawer-title">数据与使用边界</h2><p>这些控件用于体验配置流程，只保存原型偏好，不会连接账号、执行定时任务或更改真实授权。</p><h3>数据连接</h3><div class="section-box">微信机器人：未连接<br>当前数据：内置虚构示例<br>数据发送：无网络调用<br>修改保存：当前浏览器本地；不可用于保存敏感数据</div><h3>简报偏好</h3><label class="form-label" for="mode-select">业务模式（正式版按模式配置机会字段）</label><select class="text-input" id="mode-select">${['通用','商品销售','项目服务','合作协同'].map(x=>`<option ${state.preferences.mode===x?'selected':''}>${x}</option>`).join('')}</select><label class="form-label" for="report-time">每日时间 · 演示时区 UTC+8</label><input class="text-input" id="report-time" type="time" value="${esc(state.preferences.time)}"><p class="hint">仅保存选择，不会实际安排定时运行，也不会重算示例评分。</p><h3>权限状态</h3><div class="permission"><div><label>内部查询、整理与草稿</label><small>原型只展示预置内容</small></div>${pill('演示可用')}</div><div class="permission"><div><label>对外发送、报价、承诺与发布</label><small>必须由后端独立校验授权</small></div>${pill('未授权')}</div><div class="permission"><div><label for="private-only">默认私人使用</label><small>标签不是安全隔离；正式版还需限制检索与附件权限</small></div><input id="private-only" type="checkbox" class="check" ${state.preferences.privateOnly?'checked':''}></div><div class="actions-row"><button class="btn primary" data-action="save-settings">保存演示偏好</button></div><h3>演示数据</h3><p>任务状态、候选确认和条目修订仅影响这个原型。可以全部恢复，也可以使用顶部“撤销上次修改”。</p><button class="btn" data-action="reset">重置全部演示修改</button>`,'settings')}
function twinPanel(prompt=''){openDrawer('问分身 / 预置回答演示',`<h2 id="drawer-title">带着证据，和你的分身对话。</h2><p class="warning-note">此处没有连接语言模型。下方回答来自预置模板或本地关键词匹配，用于演示交互，不是真实 AI 分析。</p><div class="preset-list"><button class="preset" data-prompt="今天先做什么？">今天先做什么？</button><button class="preset" data-prompt="准备和陈宁的沟通">准备和陈宁的沟通</button><button class="preset" data-prompt="这条分身理解从哪来？">这条分身理解从哪来？</button></div><div id="chat-log"></div><div class="chat-inputbar"><input id="chat-input" aria-label="演示查询" placeholder="输入名字或条目关键词…"><button class="btn primary" data-action="ask">查询演示</button></div>`,'twin');if(prompt)answerTwin(prompt)}
function answerTwin(q){if(!q.trim())return;let response='';if(q.includes('先做')||q.includes('今日')){const ts=DATA.tasks.filter(t=>!state.done[t.id]);response=`<p>按内置演示规则，先处理已有承诺，再推进明确机会，随后解除协作阻碍。</p>${ts.length?ts.map(t=>`<p>${link(esc(t.title),'task',t.id)}</p>`).join(''):'<p>演示中的三项任务已被你标记处理。</p>'}`}else if(q.includes('陈宁')){const p=person('p1');response=`<p><strong>已知：</strong>${esc(p.need)}</p><p><strong>缺项：</strong>${esc(p.unknown)}</p><p><strong>下一步：</strong>${esc(p.next)}</p><p>${link('查看人物和原话','person','p1')}　${link('打开建议回复','task','t2')}</p>`}else if(q.includes('理解')||q.includes('哪来')){response=`<p>“先明确合作边界，再决定投入”只来自一次示例表达。它是待确认的候选理解，不是已经证明的长期人格特征。</p><p>${link('检查原文、适用范围与例外','wiki','w1')}</p>`}else{const hits=getSearchHits(q);response=hits.length?`<p>本地关键词匹配到以下记录。这里没有执行模型推理：</p>${hits.slice(0,5).map(h=>`<p>${link(esc(h.title),h.type,h.id)}</p>`).join('')}`:'<p>示例数据里没有匹配内容。完整产品应说明检索范围和缺失信息，不编造你的经历或观点。</p>'}$('#chat-log').insertAdjacentHTML('beforeend',`<div class="chat-message user">${esc(q)}</div><div class="chat-message assistant"><span class="muted-label">预置/检索演示 · 未调用模型</span>${response}</div>`);$('#chat-input').value='';$('#drawer-content').scrollTop=$('#drawer-content').scrollHeight}
function searchIndex(){return [...DATA.people.map(p=>({type:'person',id:p.id,label:'人物',title:p.name+' · '+p.org,text:p.summary+' '+p.need})),...DATA.tasks.map(t=>({type:'task',id:t.id,label:'事项',title:t.title,text:t.summary})),...DATA.knowledge.map(k=>({type:'knowledge',id:k.id,label:k.type,title:k.title,text:k.summary})),...DATA.wiki.map(w=>({type:'wiki',id:w.id,label:'分身 · '+w.dim,title:w.title,text:(state.edits[w.id]||w.summary)})),...DATA.events.map(e=>({type:'event',id:e.id,label:'时间线',title:e.title,text:e.summary}))]}
function getSearchHits(q){const v=q.trim().toLowerCase();if(!v)return searchIndex().slice(0,6);return searchIndex().filter(x=>(x.title+' '+x.text).toLowerCase().includes(v))}
function renderSearch(){const q=$('#search-input').value;const hits=getSearchHits(q);$('#search-results').innerHTML=hits.length?hits.map(h=>`<button class="search-hit" data-open="${h.type}:${h.id}"><span class="search-tag">${esc(h.label)}</span><strong>${esc(h.title)}</strong><p>${esc(h.text).slice(0,150)}</p></button>`).join(''):empty('没有匹配结果','试试“陈宁”“承诺”“合作”或“交付”。完整产品还需要语义检索与明确的权限过滤。')}
function openSearch(){closeDrawer();lastFocus=document.activeElement;$('#search-shade').classList.add('open');$('#search-modal').inert=false;$('#search-modal').classList.add('open');$('#search-modal').setAttribute('aria-hidden','false');$('main').inert=true;$('.topbar').inert=true;document.body.style.overflow='hidden';$('#search-input').value='';renderSearch();$('#search-input').focus()}
function closeSearch(){if(!$('#search-modal').classList.contains('open'))return;$('#search-shade').classList.remove('open');$('#search-modal').classList.remove('open');$('#search-modal').inert=true;$('#search-modal').setAttribute('aria-hidden','true');$('main').inert=false;$('.topbar').inert=false;document.body.style.overflow='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function go(tab,filter){closeDrawer();closeSearch();current.tab=tab;current.filter=filter||filters[tab][0];render();window.scrollTo({top:0,behavior:'instant'})}
function exportReport(){const isArchive=current.date==='2026-09-18';const lines=isArchive?['# 归档简报示例 · 2026-09-18','','本文件为页面原型导出，不包含真实聊天。','正式版会保留当时的数据范围、生成时间和版本。']:['# 昨日简报示例 · 2026-09-19','','所有人物和聊天均为虚构。仅覆盖内置示例，不是你的真实日报。','',`6 个活跃私聊，9 个业务事件，2 项我方承诺。`,'','## 今日优先事项',...DATA.tasks.map(t=>`\n### ${t.priority} ${t.title}\n状态：${state.done[t.id]?'演示中已处理':'待处理'}\n原因：${t.why}\n建议回复：${t.reply}\n依据：${t.source.map(id=>{const s=by('sources',id);return s.date+' '+s.speaker+'：“'+s.text+'”'}).join('；')}`),'','## 机会',...DATA.people.filter(p=>['p1','p2','p4'].includes(p.id)).map(p=>`\n### ${p.name} · ${p.stage}\n${p.summary}\n缺失信息：${p.unknown}\n下一步：${p.next}`),'','## 待确认的分身理解',...pendingWiki().map(w=>`\n### ${w.title}\n${w.summary}`)];const blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='简报演示_'+current.date+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已导出虚构简报示例，不包含真实账号数据。')}
async function copyReply(){const text=$('#reply-text').value;try{await navigator.clipboard.writeText(text);toast('已复制草稿，尚未发送。')}catch(e){$('#reply-text').select();const ok=document.execCommand('copy');toast(ok?'已复制草稿，尚未发送。':'已选中草稿，请手动复制。')}}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-action]');if(!b)return;
 if(b.dataset.nav){go(b.dataset.nav);return}if(b.dataset.filter){current.filter=b.dataset.filter;render();return}if(b.dataset.dimension){go('wiki',b.dataset.dimension);return}if(b.dataset.view){current.view=b.dataset.view;render();return}
 if(b.dataset.open){const [type,...rest]=b.dataset.open.split(':');detail(type,rest.join(':'));return}
 if(b.dataset.toggleTask){const id=b.dataset.toggleTask;checkpoint('更改事项状态');state.done[id]=!state.done[id];persist();render();detail('task',id);toast(state.done[id]?'已在原型中标记处理；没有发送消息。':'已恢复为待处理。');return}
 if(b.dataset.confirmWiki){const id=b.dataset.confirmWiki;checkpoint('确认分身候选');state.confirmed[id]=true;delete state.rejected[id];delete state.review[id];const revised=$('#wiki-editor')?.value.trim();if(revised&&revised!==(state.edits[id]||by('wiki',id).body))state.edits[id]=revised;persist();render();detail('wiki',id);toast('已确认演示条目，仍仅供内部使用。');return}
 if(b.dataset.rejectWiki){const id=b.dataset.rejectWiki;checkpoint('否定分身候选');state.rejected[id]=true;delete state.confirmed[id];delete state.review[id];persist();render();detail('wiki',id);toast('已否定该候选，不再作为确认记忆使用。');return}
 if(b.dataset.saveWiki){const id=b.dataset.saveWiki,text=$('#wiki-editor').value.trim();if(!text){toast('条目内容不能为空。');return}checkpoint('修订分身条目');state.edits[id]=text;state.review[id]=true;delete state.confirmed[id];delete state.rejected[id];persist();render();detail('wiki',id);toast('演示修订已保存，新版本等待确认。');return}
 if(b.dataset.prompt){answerTwin(b.dataset.prompt);return}if(b.dataset.personTwin){twinPanel('准备和'+person(b.dataset.personTwin).name+'的沟通');return}
 switch(b.dataset.action){case'close':closeDrawer();break;case'search':openSearch();break;case'close-search':closeSearch();break;case'settings':showSettings();break;case'twin':twinPanel();break;case'ask':answerTwin($('#chat-input').value);break;case'copy-reply':copyReply();break;case'wiki-review':go('wiki','待确认');break;case'refresh':render();toast('已刷新演示页面。未同步微信，也未重新调用模型。');break;case'back-today':current.date='2026-09-19';render();break;case'export-report':exportReport();break;case'save-settings':checkpoint('修改原型偏好');state.preferences={time:$('#report-time').value||'09:00',mode:$('#mode-select').value,privateOnly:$('#private-only').checked};persist();toast('已保存演示偏好，未启动定时任务或改变真实权限。');break;case'reset':if(confirm('仅清除这个原型的本地修改，恢复所有虚构示例。继续吗？')){state=JSON.parse(JSON.stringify(defaultState));persist();closeDrawer();render();toast('演示数据已恢复。')}break;case'undo':{const last=state.history.pop();if(!last){toast('目前没有可以撤销的原型修改。');break}const remaining=state.history;state={...last.snap,history:remaining};persist();render();toast('已撤销：'+last.label+'。');break}}
});
document.addEventListener('change',e=>{if(e.target.id==='date-select'){current.date=e.target.value;render()}});
$('#search-input').addEventListener('input',renderSearch);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){closeSearch();closeDrawer()}if(e.key==='Enter'&&e.target.id==='chat-input'){e.preventDefault();answerTwin(e.target.value)}if(e.key==='Tab'){const el=$('#search-modal').classList.contains('open')?$('#search-modal'):$('#drawer').classList.contains('open')?$('#drawer'):null;if(el){const focus=[...el.querySelectorAll('button,input,textarea,select,[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(focus.length){const first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}}}});
render();
</script>
</body></html>
